####manual trigger with ubuntu server where server creates infrastructure and get terminated, here server is provided by github actions.
# useing this code for bastionhost to connect private server with github actions

name: Deploy via Bastion Host
on:
  # push:
  #   branches: [ main ]
   workflow_dispatch:   # ✅ Manual trigger only


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up SSH Key and Tunnel
        env:
          BASTION_SSH_KEY: ${{ secrets.BASTION_SSH_KEY }}
          TARGET_SSH_KEY: ${{ secrets.TARGET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Add SSH private keys
          echo "$BASTION_SSH_KEY" > ~/.ssh/bastion_key
          echo "$TARGET_SSH_KEY" > ~/.ssh/target_key
          chmod 600 ~/.ssh/bastion_key ~/.ssh/target_key

          # Add host keys to known_hosts to prevent interactive prompts
          ssh-keyscan -H ${{ secrets.BASTION_IP }} >> ~/.ssh/known_hosts

          # Configure SSH ProxyJump in ~/.ssh/config
          cat <<EOF > ~/.ssh/config
          Host bastion
              HostName ${{ secrets.BASTION_IP }}
              User ${{ secrets.BASTION_USER }}
              IdentityFile ~/.ssh/bastion_key
              StrictHostKeyChecking no

          Host target
              HostName ${{ secrets.TARGET_PRIVATE_IP }}
              User ${{ secrets.TARGET_USER }}
              IdentityFile ~/.ssh/target_key
              ProxyJump bastion
              StrictHostKeyChecking no
          EOF

      - name: Execute Commands on Target Private Server
        run: |
          ssh target "echo 'Successfully connected to private server via Bastion Host!' && hostname -I"
